<style>
:root {
  color-scheme: light;
  --bg:#fff0e7; --bg2:#f9d8cb; --paper:#fff9f3; --soft:#fce8df; --line:#e7c0b3;
  --ink:#49202a; --muted:#724650; --primary:#9e374d; --on:#fff; --accent:#dc7682;
  --control-line:color-mix(in srgb,var(--muted) 65%,var(--paper));
  --side:#994751; --side2:#77323f; --sideink:#fff9ed; --active:#fff0d7; --activeink:#6c263c;
  --gold:#a05122; --green:#4a6444; --shadow:0 5px 14px #72323b15; --radius:19px;
  --serif:Georgia,'Times New Roman',serif; --sans:'Segoe UI',system-ui,sans-serif;
  --gap:15px; --pad:17px; --sidebar:230px;
}
:root[data-theme=lavender] {
  --bg:#f8edff; --bg2:#efd8f7; --paper:#fffaff; --soft:#f4e6f6; --line:#dec2e8;
  --ink:#391747; --muted:#684774; --primary:#773984; --on:#fff; --accent:#ba6bc0;
  --side:#f0dff8; --side2:#e7c8f0; --sideink:#472158; --active:#813f89; --activeink:#fff;
  --gold:#994915; --green:#43665c; --shadow:0 5px 14px #5c28731a;
}
:root[data-mode=dark] {
  color-scheme:dark;
  --bg:#28181f; --bg2:#3d212e; --paper:#38252e; --soft:#452c37; --line:#73505f;
  --ink:#fff0e9; --muted:#ebc5cc; --primary:#ff9bab; --on:#361821; --accent:#ef99a5;
  --side:#4a2635; --side2:#2c1922; --sideink:#ffefe9; --active:#ffd4cb; --activeink:#4d202e;
  --gold:#ffbc91; --green:#bdd3a8; --shadow:0 5px 16px #130a1070;
}
:root[data-theme=lavender][data-mode=dark] {
  --bg:#23192c; --bg2:#372340; --paper:#352640; --soft:#45304e; --line:#725781;
  --ink:#fff0ff; --muted:#e7cdec; --primary:#e9a8f2; --on:#32163c; --accent:#d48fe6;
  --side:#392644; --side2:#25192f; --sideink:#f9e7ff; --active:#d99ce6; --activeink:#32163c;
  --gold:#ffbc91; --green:#a9ddca; --shadow:0 5px 16px #170b1f80;
}
:root[data-readable=true] { --line:var(--muted); --muted:var(--ink); }
:root[data-font=sans] { --serif:var(--sans); }
:root[data-font=rounded] { --sans:'Trebuchet MS',system-ui,sans-serif; --serif:var(--sans); }
:root[data-density=compact] { --gap:10px; --pad:13px; }
:root[data-density=roomy] { --gap:21px; --pad:22px; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { min-height:100%; }
body { margin:0; color:var(--ink); background:radial-gradient(ellipse at top right,var(--bg2),transparent 70%),var(--bg); font:1rem/1.45 var(--sans); }
body,button,input,textarea,select { letter-spacing:var(--spacing,normal); }
button,input,textarea,select { font:inherit; }
button { cursor:pointer; }
a { color:var(--primary); }
button,input,textarea,select,a { -webkit-tap-highlight-color:transparent; }
:focus-visible { outline:3px solid var(--primary); outline-offset:3px; }
.sidebar :focus-visible,.bottom :focus-visible { outline-color:var(--sideink); }
button:disabled { opacity:.55; cursor:default; }
img,svg { display:block; max-width:100%; }
h1,h2,h3,p { margin:0; }
h1,h2,h3 { font-family:var(--serif); line-height:1.13; text-wrap:balance; overflow-wrap:anywhere; }
h1 { font-size:clamp(1.8rem,3.1vw,3.35rem); letter-spacing:-.045em; }
h2 { font-size:1.28rem; letter-spacing:-.026em; }
h3 { font-size:1.12rem; }
p { overflow-wrap:anywhere; }
.muted,small { color:var(--muted); }
.icon { width:1.2em; height:1.2em; flex:none; }
.skip { position:fixed; left:10px; top:10px; z-index:20; transform:translateY(-150%); padding:12px; background:var(--paper); }
.skip:focus { transform:none; }
.sidebar { position:fixed; inset:0 auto 0 0; width:var(--sidebar); z-index:6; display:flex; flex-direction:column; padding:24px 15px 14px; color:var(--sideink); background:radial-gradient(ellipse at 20% 5%,#fff4,transparent 48%),linear-gradient(155deg,var(--side),var(--side2)); box-shadow:4px 0 18px #48273518; }
.side-title { display:grid; justify-items:center; text-align:center; padding:0 4px 17px; gap:8px; font:italic 700 1.62rem/.98 var(--serif); letter-spacing:-.035em; }
.side-title .icon { width:23px; height:23px; }
.navlist { display:grid; align-content:start; gap:3px; overflow:auto; scrollbar-width:thin; padding:4px; }
.navlist .group { opacity:.9; margin:12px 8px 3px; text-transform:uppercase; font-size:.65rem; letter-spacing:.12em; font-weight:750; }
.navlink { border:0; border-radius:12px; background:none; color:inherit; display:flex; align-items:center; gap:9px; min-height:40px; padding:7px 9px; text-align:start; font-size:.83rem; font-weight:650; line-height:1.22; }
.navlink span { flex:1; overflow-wrap:anywhere; }
.navlink:hover { background:#ffffff2b; }
.navlink[aria-current=page] { background:var(--active); color:var(--activeink); box-shadow:var(--shadow); }
.brand { margin-top:auto; padding:13px 5px 1px; flex:none; }
.brand svg { width:153px; height:auto; }
.mark-light { display:none; }
[data-theme=peach] .mark-light,[data-mode=dark] .mark-light { display:block; }
[data-theme=peach] .mark-dark,[data-mode=dark] .mark-dark { display:none; }
.shell { margin-inline-start:var(--sidebar); }
.top { display:flex; align-items:center; gap:9px; min-height:64px; padding:10px clamp(13px,2.1vw,30px); background:color-mix(in srgb,var(--paper) 78%,transparent); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:4; backdrop-filter:blur(13px); }
.top-title { font:700 1.27rem/1.04 var(--serif); min-width:0; margin-inline-end:auto; overflow-wrap:anywhere; }
.top-title span { color:var(--primary); }
.top .icon-btn,.top select { flex:none; }
.top select { width:auto; padding:5px 3px; font-size:.79rem; font-weight:800; }
.menu { display:none !important; }
.avatar img { width:26px; height:26px; object-fit:cover; border-radius:50%; background:var(--soft); }
.container { width:min(100%,1440px); margin-inline:auto; padding:clamp(13px,2vw,29px); outline:0; }
.demo-banner { display:flex; align-items:center; gap:10px; margin-bottom:var(--gap); padding:9px 13px; border:1px solid var(--line); border-inline-start:4px solid var(--primary); border-radius:13px; background:var(--soft); color:var(--ink); font-size:.86rem; }
.demo-banner .icon { width:21px; height:21px; color:var(--primary); }
.demo-banner p { color:var(--muted); }
.demo-banner > div { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 10px; min-width:0; }
.demo-banner strong { font-weight:800; overflow-wrap:anywhere; }
.hero { position:relative; isolation:isolate; overflow:hidden; display:flex; align-items:center; min-height:204px; padding:27px clamp(15px,3vw,46px); border-radius:24px; border:1px solid var(--line); background:radial-gradient(ellipse at 76% 90%,var(--paper) 5%,transparent 60%),linear-gradient(115deg,var(--paper) 14%,var(--soft) 55%,var(--bg2)); box-shadow:var(--shadow); }
.hero-copy { min-width:0; max-width:64%; z-index:1; }
.hero h1 { margin:7px 0 9px; }
.hero h1 em { color:var(--primary); font-weight:400; }
.eyebrow { text-transform:uppercase; font-weight:800; font-size:.69rem; letter-spacing:.13em; color:var(--muted); }
.hero p { font-size:clamp(.87rem,1.4vw,1.06rem); max-width:36ch; }
.hero .row { margin-top:13px; }
.hero-art { position:absolute; inset:auto 3% -18% auto; width:min(45%,400px); height:123%; object-fit:contain; object-position:center top; z-index:-1; filter:drop-shadow(0 8px 12px #50213a29); }
[data-theme=lavender] .hero-art { filter:hue-rotate(-12deg) drop-shadow(0 8px 12px #5b217d2c); }
.botanical { pointer-events:none; color:var(--accent); }
.hero .botanical { position:absolute; width:36%; height:100%; opacity:.55; inset:auto 0 0 auto; z-index:-2; }
.minihero { min-height:133px; margin-bottom:var(--gap); }
.minihero .hero-art { height:130%; bottom:-24%; }
.stats,.grid { display:grid; gap:var(--gap); }
.stats { grid-template-columns:repeat(4,minmax(0,1fr)); margin:var(--gap) 0; }
.stat { color:var(--ink); background:linear-gradient(135deg,var(--paper),var(--soft)); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); min-height:75px; display:flex; align-items:center; gap:11px; padding:11px; text-align:start; }
.stat span:last-child { min-width:0; overflow-wrap:anywhere; }
.stat b { display:block; font:700 1.15rem/1.12 var(--serif); }
.stat small { font-size:.8rem; font-weight:650; }
.badge-icon { width:38px; height:38px; border-radius:13px; background:var(--soft); color:var(--primary); display:grid; place-items:center; flex:none; }
.badge-icon .icon { width:22px; height:22px; }
.stat:nth-child(3n+2) .badge-icon { color:var(--gold); }
.stat:nth-child(3n) .badge-icon { color:var(--green); }
.grid { grid-template-columns:repeat(3,minmax(0,1fr)); align-items:stretch; }
.grid.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
.card { position:relative; isolation:isolate; min-width:0; padding:var(--pad); border:1px solid var(--line); border-radius:var(--radius); background:linear-gradient(140deg,var(--paper) 58%,color-mix(in srgb,var(--paper) 70%,var(--soft))); box-shadow:var(--shadow); }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:7px; margin-bottom:11px; }
.card h2 { display:flex; gap:8px; align-items:center; }
.card h2 .icon { color:var(--primary); }
.card .corner { position:absolute; width:105px; height:98px; right:0; bottom:0; object-fit:contain; object-position:bottom right; z-index:-1; opacity:.26; pointer-events:none; }
.card.illustrated .body { max-width:74%; }
.card.illustrated .corner { opacity:.94; }
.card .bottom-action { margin-top:12px; }
.btn,.icon-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:41px; border:1px solid var(--control-line); background:var(--paper); color:var(--ink); border-radius:11px; padding:7px 11px; font-size:.86rem; font-weight:700; line-height:1.22; text-align:center; text-decoration:none; overflow-wrap:anywhere; }
.btn:hover,.icon-btn:hover,.stat:hover { background:var(--soft); }
.btn.primary,.btn[aria-pressed=true],.mobile-add { color:var(--on); background:var(--primary); border-color:var(--primary); }
.btn.primary:hover,.btn[aria-pressed=true]:hover { filter:brightness(1.08); }
.icon-btn { width:40px; min-height:40px; padding:0; flex:none; }
.icon-btn .icon { width:19px; height:19px; }
.row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.spread { justify-content:space-between; }
.stack { display:grid; gap:var(--gap); }
.toolbar { margin:var(--gap) 0; }
input:not([type=checkbox]):not([type=radio]),textarea,select { min-width:0; width:100%; min-height:41px; background:var(--paper); color:var(--ink); border:1px solid var(--control-line); border-radius:10px; padding:7px 9px; }
textarea { resize:vertical; min-height:67px; }
input::placeholder,textarea::placeholder { color:var(--muted); opacity:1; }
input[type=checkbox],input[type=radio],input[type=range],progress { accent-color:var(--primary); }
input[type=checkbox] { width:18px; height:18px; flex:none; margin:0; }
label { min-width:0; }
.field { display:grid; gap:4px; font-size:.86rem; font-weight:650; }
.formgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.wide { grid-column:1/-1; }
.filters { display:flex; gap:7px; flex-wrap:wrap; align-items:end; }
.filters>* { flex:1 1 120px; }
.list { display:grid; gap:1px; }
.item { display:flex; justify-content:space-between; gap:7px; align-items:center; min-height:43px; padding:5px 0; border-bottom:1px solid var(--line); }
.item:last-child { border-bottom:0; }
.item .mainlabel { display:flex; align-items:center; gap:8px; min-width:0; flex:1; min-height:34px; }
.item .mainlabel span { overflow-wrap:anywhere; }
.item .mainlabel small { display:block; }
.item .icon-btn { width:34px; min-height:34px; }
.done .task-title { text-decoration:line-through; color:var(--muted); }
.tag { display:inline-flex; padding:3px 7px; border-radius:7px; background:var(--soft); color:var(--muted); font-size:.74rem; font-weight:700; overflow-wrap:anywhere; }
.empty { padding:11px 0; font-size:.86rem; color:var(--muted); }
.bar { display:grid; grid-template-columns:1fr auto; gap:3px 10px; margin:9px 0; font-size:.82rem; }
progress { width:100%; height:11px; grid-column:1/-1; border:0; border-radius:10px; overflow:hidden; background:var(--soft); }
progress::-webkit-progress-bar { background:var(--soft); }
progress::-webkit-progress-value { background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:10px; }
progress::-moz-progress-bar { background:var(--primary); }
.ring { display:inline-grid; position:relative; place-items:center; width:63px; aspect-ratio:1; flex:none; font-size:.77rem; font-weight:800; }

function go(next) { if(next==='more') { setDrawer(!drawer); return; } if($('#quick-thought'))brainDraft=$('#quick-thought').value; page=next; drawer=false; draw(); window.scrollTo(0,0); $('#main').focus({preventScroll:true}); }

function showToast(label,...args) { const target=$('.toast'); target.textContent=tr(label,...args); clearTimeout(toastTimeout); toastTimeout=setTimeout(()=>{target.textContent='';},4100); }
function tone(kind='click') {
  const setting=state.settings;

  try {
    audio ||= new AudioContext();
    if(audio.state==='suspended') audio.resume().catch(()=>{});

function modal(title, content, submit, onSubmit, extra='') {

function confirmAction(title, text, fn) { modal(title,`<p>${tx(text)}</p>`,'Confirm',()=>{closeModal();fn();}); }
function closeModal() { $('dialog').close(); }
function saveMessage(label='Saved') { putState(); draw(true); showToast(label); }
function openDB() {
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
    let request, settled=false;
    const finish=(fn,value)=>{if(settled){if(fn===resolve)value?.close();return;} settled=true;clearTimeout(timeout);fn(value);};
    const timeout=setTimeout(()=>finish(reject,new Error('Storage timeout')),2200);
    try { request=indexedDB.open(STORAGE_KEY,1); } catch(err) { finish(reject,err); return; }
    request.onupgradeneeded=()=>request.result.createObjectStore('data');
    request.onerror=()=>finish(reject,request.error);
    request.onblocked=()=>finish(reject,new Error('Storage blocked'));
    request.onsuccess=()=>finish(resolve,request.result);
  });
}
let db, queue=Promise.resolve();
function dbRead() { return new Promise((res,rej)=>{const req=db.transaction('data','readonly').objectStore('data').get('state');req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);}); }
function dbWrite(data) { return new Promise((res,rej)=>{const trans=db.transaction('data','readwrite');trans.oncomplete=res;trans.onerror=()=>rej(trans.error);trans.onabort=()=>rej(trans.error);trans.objectStore('data').put(data,'state');}); }
function putState() {
  const data=JSON.stringify(state);
  if(backend==='localStorage') { try { localStorage.setItem(STORAGE_KEY,data); } catch { backend='memory'; showToast('Storage unavailable. Changes are kept for this session.'); } return; }
  if(backend!=='IndexedDB') return;
  queue=queue.then(()=>backend==='IndexedDB'?dbWrite(data):null).catch(()=>{backend='memory'; try {localStorage.setItem(STORAGE_KEY,JSON.stringify(state));backend='localStorage';} catch {showToast('Storage unavailable. Changes are kept for this session.');}});
}
function cleanSettings(value={}) {
  const items=value && typeof value==='object' ? value : {};
  const result={...defaults};
  const choices={lang:Object.keys(locales),theme:['peach','lavender'],appearance:['light','dark','system'],font:['serif','sans','rounded'],size:[90,100,110,120],density:['normal','compact','roomy'],motion:['full','gentle','off'],weekStart:[0,1,6],currency:['USD','EUR','GBP','CAD','AUD','MAD'],moodScale:[5,10]};
  for(const [key,options] of Object.entries(choices)) if(options.includes(items[key])) result[key]=items[key];
  for(const key of ['spacing','readable','sound','click','hover','celebrate','relax','notifications']) if(typeof items[key]==='boolean') result[key]=items[key];
  if(Number.isFinite(items.volume)) result.volume=Math.max(0,Math.min(100,items.volume));

function installEvents() {

async function initialize() {
  let localState;
  try {
    const raw=localStorage.getItem(STORAGE_KEY);
    backend='localStorage';
    if(raw) localState=normalize(JSON.parse(raw));
  } catch { /* Ignore unreadable fallback data. */ }
  let stored=localState;
  try {
    db=await openDB();
    const raw=await dbRead();
    if(localState) {
      // A prior write failure can leave a newer fallback copy than IndexedDB.

      try { stored=normalize(JSON.parse(raw)); } catch {}

}

const STORAGE_KEY='wellkept-mom-planner-demo-v1';

function normalize(raw) {
  if(raw?.version!==1||!Array.isArray(raw.tasks)||!Array.isArray(raw.thoughts))throw new Error('Invalid demo data');

function bottomLinks() {return [['family','Family','people'],['more','More','grid']];}
